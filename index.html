  function budgetPage(){const s=sums();const categories={};data.budget.filter(x=>!x.hypothetical).forEach(x=>categories[x.category]=(categories[x.category]||0)+int(x.estimate));return `<div class="page-intro"><div class="eyebrow">Finanças com carinho</div><h1>O orçamento sem sustos.</h1><p>Planejem valores, registrem pagamentos e enxerguem o que ainda cabe no sonho. Tudo em reais e editável.</p></div><div class="grid stats">${stats('Teto do casal',money(s.limit),'Editável em Personalizar','◈')}${stats('Custo planejado',money(s.planned),`${s.realCount} itens no planejamento${s.hypoCount?` · +${money(s.hypo)} em hipóteses (fora do total)`:''}`,'◇')}${stats('Já pago',money(s.paid),'Pagamentos registrados','✓')}${stats('Disponível após reserva',s.limit?money(s.remaining):'A definir',`${int(data.settings.reservePct)}% de reserva previsto`,'♡')}</div>
  ${head('Planilha viva','Criem itens, editem preços e registrem cada pagamento.','Adicionar gasto','add-budget')}
  <div class="grid two-col"><div class="card"><div class="card-title"><h3>Itens do orçamento</h3><button class="btn small secondary" data-action="add-budget">＋ Item</button></div>${data.budget.length?`<div class="items">${data.budget.map(budgetHTML).join('')}</div>`:empty('◈','Ainda não há gastos planejados. Adicionem estimativas reais ou criem uma distribuição inicial.','Criar distribuição por categoria','seed-budget')}</div><div class="grid" style="align-content:start"><div class="card"><h3>Distribuição por categoria</h3>${Object.keys(categories).length?Object.entries(categories).sort((a,b)=>b[1]-a[1]).map(([cat,n])=>`<div class="barline"><span>${esc(cat)}</span><div class="barbg"><i style="width:${percent(n,s.planned)}%"></i></div><span>${money(n)}</span></div>`).join(''):empty('♢','As categorias aparecerão assim que vocês adicionarem itens.')}</div><div class="card"><h3>Calculadora de segurança</h3><div class="divider"></div><div class="row"><span class="muted">Teto definido</span><b>${money(s.limit)}</b></div><div class="divider"></div><div class="row"><span class="muted">− Total planejado</span><b>${money(s.planned)}</b></div><div class="divider"></div><div class="row"><span class="muted">− Reserva (${int(data.settings.reservePct)}%)</span><b>${money(s.reserve)}</b></div><div class="divider"></div><div class="row"><b>${s.remaining<0?'Acima do limite de segurança':'Margem para novas escolhas'}</b><strong style="color:${s.remaining<0?'#b54b4b':'var(--green)'}">${s.limit?money(Math.abs(s.remaining)):'Definir teto'}</strong></div><p class="muted mini" style="margin-top:13px">Essa é uma ferramenta de planejamento, não uma cotação automática de mercado.</p></div></div></div>`;}
  function budgetHTML(x){const remaining=Math.max(0,int(x.estimate)-int(x.paid));return `<div class="item"><div class="item-top"><div><div class="item-name">${esc(x.title)}</div><div class="mini muted" style="margin-top:4px">${esc(x.category||'Outros')}${x.hypothetical?' <span class="chip amber" title="Simulação: não entra nos totais do planejamento">Hipótese</span>':''}</div></div><div class="right"><div class="price">${money(x.estimate)}</div><small>Pago: ${money(x.paid)}</small></div></div><div class="item-footer"><span class="chip ${remaining===0?'green':'amber'}">${remaining===0?'Quitado':'Falta '+money(remaining)}</span><div class="item-actions"><button class="btn tiny secondary" data-action="edit-budget" data-id="${esc(x.id)}">Editar</button><button class="btn tiny danger" data-action="delete" data-type="budget" data-id="${esc(x.id)}">Excluir</button></div></div></div>`;}
  function guestsPage(){const g=guestsInfo();const q=guestQuery.toLowerCase(),filtered=data.guests.filter(x=>x.name.toLowerCase().includes(q));return `<div class="page-intro"><div class="eyebrow">Gente que faz parte da história</div><h1>Quem vai celebrar com a gente?</h1><p>Lista de convidados com acompanhantes, grupos e confirmação de presença. Mudar o status é um clique.</p></div><div class="grid guest-summary" style="margin-top:22px">${stats('Total na lista',g.total,'Inclui acompanhantes','♧')}${stats('Confirmados',g.yes,'Presenças confirmadas','✓')}${stats('Aguardando',g.pending,'Respostas pendentes','◷')}${stats('Não irão',g.no,'Para organização','·')}</div>${head('Nossa lista',`Meta inicial: ${int(data.settings.guestGoal)} lugares. ${g.total>int(data.settings.guestGoal)?'A lista ultrapassou a meta.':'Podem ajustar nas configurações.'}`)}<div class="toolbar"><input id="guest-search" class="search" type="search" placeholder="Buscar convidado..." value="${esc(guestQuery)}" aria-label="Buscar convidado"><button class="btn" data-action="add-guest">＋ Convidado</button></div>${filtered.length?`<div class="grid two-col">${filtered.map(guestHTML).join('')}</div>`:empty('♧',data.guests.length?'Ninguém corresponde à busca.':'Comecem adicionando as pessoas que querem perto de vocês.','Adicionar convidado','add-guest')}`;}
  function guestHTML(g){const color=g.attendance==='Confirmado'?'green':g.attendance==='Não vai'?'gray':'amber';return `<div class="item"><div class="item-top"><div><div class="item-name">${esc(g.name)}</div><p>${esc(g.group||'Família e amigos')} · ${Math.max(1,int(g.qty))} pessoa(s) · ${esc(g.side||'Ambos')}</p></div><span class="chip ${color}">${esc(g.attendance)}</span></div>${g.notes?`<p>${esc(g.notes)}</p>`:''}<div class="item-footer"><select class="search" style="width:auto" data-change="guest-status" data-id="${esc(g.id)}" aria-label="Status de ${esc(g.name)}"><option ${g.attendance==='Pendente'?'selected':''}>Pendente</option><option ${g.attendance==='Confirmado'?'selected':''}>Confirmado</option><option ${g.attendance==='Não vai'?'selected':''}>Não vai</option></select><div class="item-actions"><button class="btn tiny secondary" data-action="edit-guest" data-id="${esc(g.id)}">Editar</button><button class="btn tiny danger" data-action="delete" data-type="guests" data-id="${esc(g.id)}">Excluir</button></div></div></div>`;}
  function vendorsPage(){const closed=data.vendors.filter(x=>x.status==='Fechado').length;const total=data.vendors.reduce((n,x)=>n+int(x.quote),0);return `<div class="page-intro"><div class="eyebrow">Escolhas bem acompanhadas</div><h1>Fornecedores e propostas.</h1><p>Buffet, fotografia, decoração, música, espaço e tudo mais. Comparem propostas sem confundir orçamento estimado com contratação.</p></div><div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stats('Propostas cadastradas',data.vendors.length,`${closed} fechadas`,'♢')}${stats('Soma das cotações',money(total),'Comparativo, não é gasto contratado','◈')}</div>${head('Nossos contatos','Registrem o preço, a impressão de vocês e o andamento de cada negociação.','Novo fornecedor','add-vendor')}${data.vendors.length?`<div class="grid two-col">${data.vendors.map(vendorHTML).join('')}</div>`:empty('♢','Nenhuma proposta cadastrada. Adicionem contatos e comparem antes de fechar.','Cadastrar fornecedor','add-vendor')}<div class="feature-note" style="margin-top:16px">As cotações <strong>não entram automaticamente no orçamento</strong>. Ao clicar em “Levar ao orçamento”, o valor da proposta passa a fazer parte do planejamento, uma única vez por fornecedor.</div>`;}
  function vendorHTML(x){return `<div class="item big"><div class="item-top"><div><span class="chip">${esc(x.kind)}</span><div class="item-name" style="font-size:18px;margin-top:10px">${esc(x.name)}</div><p>${esc(x.contact||'Contato não informado')}</p></div><div class="right"><div class="price">${money(x.quote)}</div><span class="chip ${x.status==='Fechado'?'green':x.status==='Descartado'?'gray':'amber'}">${esc(x.status)}</span></div></div>${x.notes?`<p>${esc(x.notes)}</p>`:''}<div class="item-footer"><small>Impressão do casal: ${esc(x.rating||'Ainda não avaliado')}</small><div class="item-actions"><button class="btn tiny secondary" data-action="transfer-vendor" data-id="${esc(x.id)}">Levar ao orçamento</button><button class="btn tiny secondary" data-action="edit-vendor" data-id="${esc(x.id)}">Editar</button><button class="btn tiny danger" data-action="delete" data-type="vendors" data-id="${esc(x.id)}">Excluir</button></div></div></div>`;}
  function taskHTML(x){return `<div class="task ${x.done?'done':''}"><input type="checkbox" data-change="task" data-id="${esc(x.id)}" ${x.done?'checked':''} aria-label="Concluir tarefa ${esc(x.title)}"><div class="task-copy"><strong>${esc(x.title)}</strong><small>${esc(x.phase||'Geral')} · ${esc(x.owner||'Juntos')}${x.due?' · '+fmtDate(x.due):''}</small></div><button class="link mini" data-action="edit-task" data-id="${esc(x.id)}" aria-label="Editar ${esc(x.title)}">Editar</button></div>`;}
  function ceremonyPage(){const t=complete();let arr=data.tasks.filter(x=>filter==='todos'||(filter==='pendentes'?!x.done:x.done));const timeline=[...data.timeline].sort((a,b)=>String(a.time).localeCompare(String(b.time)));return `<div class="page-intro"><div class="eyebrow">Roteiro do grande dia</div><h1>Dos preparativos ao “sim”.</h1><p>Um espaço para a cerimônia, o cronograma e os detalhes que não podem escapar. Os horários são definidos por vocês.</p></div><div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stats('Checklist',`${t.done}/${t.all}`,`${t.pct}% concluído`,'✓')}${stats('Momentos no roteiro',timeline.length,'Eventos programados','✧')}</div><div class="grid two-col" style="margin-top:26px"><div class="card"><div class="card-title"><h3>Checklist de preparação</h3><button class="btn small secondary" data-action="add-task">＋ Tarefa</button></div><div class="filters" style="margin-bottom:12px"><button class="filter ${filter==='todos'?'active':''}" data-action="filter" data-filter="todos">Todas</button><button class="filter ${filter==='pendentes'?'active':''}" data-action="filter" data-filter="pendentes">Pendentes</button><button class="filter ${filter==='concluidas'?'active':''}" data-action="filter" data-filter="concluidas">Concluídas</button></div>${arr.length?arr.map(taskHTML).join(''):empty('✓','Nenhuma tarefa nesta visualização.','Nova tarefa','add-task')}</div><div class="card"><div class="card-title"><h3>Agenda da cerimônia</h3><button class="btn small secondary" data-action="add-event">＋ Momento</button></div>${timeline.length?`<div class="timeline">${timeline.map(x=>`<div class="timeline-item"><small>${esc(x.time)}</small><strong style="display:block">${esc(x.title)}</strong>${x.details?`<p>${esc(x.details)}</p>`:''}<div style="margin-top:5px"><button class="link mini" data-action="edit-event" data-id="${esc(x.id)}">Editar</button><button class="link mini" style="color:#b35a5a" data-action="delete" data-type="timeline" data-id="${esc(x.id)}">Excluir</button></div></div>`).join('')}</div>`:empty('✧','O roteiro está em branco, esperando a história de vocês.','Adicionar primeiro momento','add-event')}<div class="feature-note" style="margin-top:15px">Sugestão: prevejam entrada, votos, alianças, fotos, recepção e imprevistos. Ajustem de acordo com o espaço e as pessoas contratadas.</div></div></div>`;}
  const voteLabel=v=>v==='sim'?'♡ Amei':v==='talvez'?'◌ Talvez':v==='nao'?'× Não curti':'Sem opinião';
  function ideaHTML(x){const a=x.votes?.a,b=x.votes?.b;let result=a&&b?(a==='sim'&&b==='sim'?'♡ Os dois amaram!':a==='nao'&&b==='nao'?'Os dois preferem outra ideia.':'Opiniões diferentes: vale conversar.'):'';return `<div class="item big"><span class="chip">${esc(x.category||'Inspiração')}</span><h3 style="margin:13px 0 4px">${esc(x.title)}</h3><p>${esc(x.details||'Sem descrição ainda.')}</p><div class="vote-row"><div class="vote-box"><small>${esc(nameA())}</small><div class="vote-options">${voteButtons(x.id,'a',a)}</div></div><div class="vote-box"><small>${esc(nameB())}</small><div class="vote-options">${voteButtons(x.id,'b',b)}</div></div></div>${result?`<div class="agreement">${result}</div>`:''}<div class="item-footer"><small>Um espaço para discordar com carinho.</small><div class="item-actions"><button class="btn tiny secondary" data-action="edit-idea" data-id="${esc(x.id)}">Editar</button><button class="btn tiny danger" data-action="delete" data-type="ideas" data-id="${esc(x.id)}">Excluir</button></div></div></div>`;}
  function voteButtons(id,person,current){return [['sim','♡'],['talvez','◌'],['nao','×']].map(([v,s])=>`<button class="vote-btn ${current===v?'selected':''}" data-action="vote" data-id="${esc(id)}" data-person="${person}" data-vote="${v}" title="${esc(voteLabel(v))}" aria-label="${esc(voteLabel(v))} para ${person==='a'?esc(nameA()):esc(nameB())}" aria-pressed="${current===v}">${s}</button>`).join('');}
  function ideasPage(){const both=data.ideas.filter(x=>x.votes?.a==='sim'&&x.votes?.b==='sim').length;return `<div class="page-intro"><div class="eyebrow">O nosso jeito</div><h1>Ideias, desejos e opiniões.</h1><p>Uma espécie de Pinterest de decisões: cada um vota, os dois descobrem o que amam em comum e o que merece conversa.</p></div><div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stats('Ideias guardadas',data.ideas.length,'Possibilidades abertas','♡')}${stats('Aprovadas pelos dois',both,'Votos positivos em conjunto','✧')}</div>${head('Nosso mural','Não há resposta errada. Às vezes a melhor ideia aparece depois de um “talvez”.','Guardar ideia','add-idea')}${data.ideas.length?`<div class="grid two-col">${data.ideas.map(ideaHTML).join('')}</div>`:empty('♡','Qual seria a primeira ideia de vocês? Um tipo de decoração, um vestido, uma música, uma comida...','Guardar nossa primeira ideia','add-idea')}`;}
  const agentDefs=[['financeiro','◈','Consultor de orçamento','Analisa teto, gastos e reserva, apontando prioridades e desvios.'],['buffet','♧','Especialista em buffet','Dimensiona convidados, compara cotações e propõe perguntas para degustações.'],['cerimonia','✧','Cerimonialista','Revisa cronograma e aponta decisões importantes antes do evento.'],['fornecedores','♢','Curador de fornecedores','Ajuda a comparar opções e evitar decisões apenas pelo menor preço.'],['convidados','♡','Gestor de convidados','Organiza confirmações, capacidade e pessoas ainda sem resposta.'],['decisoes','✦','Mediador de ideias','Encontra consensos e sugestões que vocês ainda precisam discutir.']];
  function recommendations(which){const s=sums(),g=guestsInfo(),t=complete();const goal=Math.max(g.total,int(data.settings.guestGoal));const pending=data.tasks.filter(x=>!x.done);switch(which){

    case 'fornecedores':{const closed=data.vendors.filter(x=>x.status==='Fechado').length;return {title:'Raio X das propostas',body:`Há ${data.vendors.length} fornecedor(es) registrado(s) e ${closed} fechado(s).`,points:['Compare propostas pelo mesmo escopo: itens inclusos, quantidade de profissionais, horas de serviço e taxas adicionais.','Peçam por escrito prazos de pagamento, regras de adiamento/cancelamento e o que acontece com eventual substituição da equipe.',data.vendors.length?'Registrem a impressão de cada proposta e discutam as diferenças antes de contratar.':'Criem um cadastro de fornecedor para comparar preços e condições.'],action:'add-vendor',caption:'Cadastrar fornecedor'};}
    case 'convidados':return {title:'Raio X dos convidados',body:`A lista tem ${g.total} pessoas, com ${g.yes} confirmadas e ${g.pending} ainda pendentes.`,points:[`A meta configurada é de ${int(data.settings.guestGoal)} convidados${g.total>int(data.settings.guestGoal)?', atualmente ultrapassada.':'.'}`,g.pending?'Separem um momento para solicitar confirmação às pessoas pendentes.':'Não há confirmações pendentes cadastradas.','Confiram acompanhantes, necessidades alimentares e acessibilidade diretamente com cada pessoa.'],action:'add-guest',caption:'Novo convidado'};
    default:{const yes=data.ideas.filter(x=>x.votes?.a==='sim'&&x.votes?.b==='sim'),different=data.ideas.filter(x=>x.votes?.a&&x.votes?.b&&x.votes.a!==x.votes.b);return{title:'Conversa entre duas visões',body:`Vocês têm ${yes.length} ideia(s) que agradaram aos dois e ${different.length} que geraram opiniões diferentes.`,points:[yes.length?`Ponto de consenso: ${yes.slice(0,2).map(x=>x.title).join(', ')}.`:'Criem uma ideia simples e registrem o voto de cada um.',different.length?`Vale conversar sobre: ${different.slice(0,2).map(x=>x.title).join(', ')}.`:'Nenhuma divergência registrada até agora.','Tentem distinguir “é essencial”, “seria bom” e “não faz falta”; isso ajuda quando o orçamento exigir escolhas.'],action:'add-idea',caption:'Criar ideia'};}

  function settingsPage(){const v=data.settings;return `<div class="page-intro"><div class="eyebrow">A personalidade do nosso ateliê</div><h1>Façam desse espaço a casa de vocês.</h1><p>Vocês podem mudar nomes, data, orçamento e até a mensagem surpresa. Cada ajuste muda o painel.</p></div><div class="grid two-col" style="margin-top:25px"><div class="card"><h3>Nosso casamento</h3><form id="settings-form"><div class="setting-grid" style="margin-top:20px"><div class="field"><label for="personA">Seu nome</label><input id="personA" name="personA" value="${esc(v.personA)}" placeholder="Seu nome"></div><div class="field"><label for="personB">Nome do seu amor</label><input id="personB" name="personB" value="${esc(v.personB)}" placeholder="Nome dela"></div><div class="field"><label for="date">Data do casamento</label><input id="date" name="date" type="date" value="${esc(v.date)}"></div><div class="field"><label for="city">Cidade / local</label><input id="city" name="city" value="${esc(v.city)}" placeholder="Onde será"></div><div class="field"><label for="budget">Teto de orçamento (R$)</label><input id="budget" name="budget" type="number" min="0" step="0.01" value="${int(v.budget)}"></div><div class="field"><label for="guestGoal">Meta de convidados</label><input id="guestGoal" name="guestGoal" type="number" min="0" step="1" value="${int(v.guestGoal)}"></div><div class="field"><label for="reservePct">Reserva para imprevistos (%)</label><input id="reservePct" name="reservePct" type="number" min="0" max="50" step="1" value="${int(v.reservePct)}"></div><div class="field"><label for="style">Estilo da celebração</label><input id="style" name="style" value="${esc(v.style)}" placeholder="Clássico, moderno, intimista..."></div><div class="field span-all"><label for="message">Mensagem surpresa para quem você ama</label><textarea id="message" name="message" maxlength="1600">${esc(v.message)}</textarea><small>Ela aparece ao clicar no botão “Uma mensagem para você”.</small></div></div><div ores">Abrir fornecedor</button></div></div></div>`;

    const root=document.getElementById('modal-root');root.innerHTML=`<div class="overlay" id="app-overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="btn small secondary close" data-action="close" aria-label="Fechar">✕</button><div class="eyebrow">Nosso Sim</div><h2 id="dialog-title">${title}</h2><p class="muted mini">Todos os campos podem ser alterados depois.</p><form id="edit-form" data-type="${type}" data-id="${esc(x.id||'')}"><div class="form-grid">${contents}</div><div class="dialog-actions"><button type="button" class="btn secondary" data-action="close">Cancelar</button><button type="submit" class="btn">${edit?'Salvar alterações':'Adicionar'}</button></div></form></div></div>`;root.querySelector('input,select,textarea')?.focus();}
  function getByType(type){return ({budget:data.budget,guest:data.guests,vendor:data.vendors,task:data.tasks,event:data.timeline,idea:data.ideas,couple:data.couples,gift:data.gifts})[type];}
  function handleForm(form){const type=form.dataset.type,vals=Object.fromEntries(new FormData(form).entries());if(!vals.title&&!vals.name){toast('Preencha o nome ou a descrição.',true);return;}if(type==='budget'){vals.estimate=int(vals.estimate);vals.paid=int(vals.paid);if(vals.paid>vals.estimate){toast('O valor pago não pode ultrapassar o valor planejado.',true);return;}}if(type==='vendor')vals.quote=int(vals.quote);if(type==='gift')vals.price=int(vals.price);if(type==='guest'){vals.qty=Math.max(1,Math.round(int(vals.qty)));const hasA=vals.adults!==undefined&&vals.adults!=='',hasC=vals.children!==undefined&&vals.children!=='';if(hasA||hasC){vals.adults=Math.round(int(vals.adults));vals.children=Math.round(int(vals.children));if(vals.adults+vals.children!==vals.qty){toast('Adultos + crianças precisa dar o total de pessoas ('+vals.qty+').',true);return;}}else{delete vals.adults;delete vals.children;}}if(type==='task')vals.done=(getByType(type).find(x=>x.id===form.dataset.id)?.done)||false;if(type==='idea')vals.votes=(getByType(type).find(x=>x.id===form.dataset.id)?.votes)||{a:null,b:null};
    const list=getByType(type),index=list.findIndex(x=>x.id===form.dataset.id);if(index>=0){list[index]={...list[index],...vals};}else{list.push({id:id(),...vals});}save();document.getElementById('modal-root').innerHTML='';render();toast(index>=0?'Alterações salvas!':'Adicionado ao planejamento!');}
  function seedBudget(){if(data.budget.length){toast('O orçamento já tem itens. Adicione ou edite as categorias existentes.',true);return;}const p=[['Espaço',22],['Buffet',28],['Decoração',12],['Fotografia',10],['Música',8],['Trajes',8],['Cerimonial',6],['Outros',6]];if(!int(data.settings.budget)){section='ajustes';render();toast('Defina primeiro o teto para distribuir um orçamento ilustrativo.',true);return;}const usable=int(data.settings.budget)*(1-int(data.settings.reservePct)/100);p.forEach(([category,pct])=>data.budget.push({id:id(),title:'Planejamento inicial: '+category,category,estimate:Math.round(usable*pct)/100,paid:0}));save();render();toast('Distribuição ilustrativa criada. Ajustem às propostas reais.');}
  function transferVendor(vid){const v=data.vendors.find(x=>x.id===vid);if(!v)return;const match=data.budget.find(x=>x.vendorId===vid);if(match){match.estimate=int(v.quote);match.title=`${v.kind}: ${v.name}`;if(int(match.paid)>int(match.estimate)){match.paid=int(match.estimate);}toast('Orçamento vinculado atualizado.');}else{data.budget.push({id:id(),vendorId:vid,title:`${v.kind}: ${v.name}`,category:categories.includes(v.kind)?v.kind:'Outros',estimate:int(v.quote),paid:0});toast('Proposta levada ao orçamento.');}save();render();}
  function openMoreMenu(){document.getElementById('modal-root').innerHTML=`<div class="overlay" id="app-overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="more-title"><button class="btn small secondary close" data-action="close">✕</button><h2 id="more-title">Explorar nosso ateliê</h2><p class="muted">Tudo que vocês podem organizar juntos.</p><div class="grid" style="gap:7px">${nav.map(([key,label])=>`<button class="btn secondary" data-action="nav" data-section="${key}" style="justify-content:flex-start"><span style="font-size:20px;margin-right:7px">${icons[key]}</span>${label}</button>`).join('')}</div></div></div>`;}
  function showSurprise(){const text=data.settings.message.trim()||'Que alegria construir este dia com você.';const message=esc(text).replace(/\n/g,'<br>');document.getElementById('modal-root').innerHTML=`<div class="overlay" id="app-overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="surprise-title" style="padding:0;overflow:hidden"><div class="surprise"><button class="btn small gold" style="float:right" data-action="close">✕</button><div style="clear:both"></div><div class="hearts">♡ ✧ ♡</div><div class="eyebrow" style="color:#ecc59b;margin-top:18px">Para ${esc(nameB())}</div><h2 id="surprise-title">Antes do grande dia...</h2><p>${message}</p><div class="hearts">♡</div><div class="mini" style="color:#e3c5bf;margin-top:15px">Com amor, ${esc(nameA())}</div></div></div></div>`;}
  function exportData(){const fname='nosso-sim-backup-'+new Date().toISOString().slice(0,10)+'.json';if(window.IrisAndroid&&window.IrisAndroid.saveFile){const r=String(window.IrisAndroid.saveFile(fname,JSON.stringify(data,null,2)));if(r.indexOf('ERRO:')===0)toast('Não consegui salvar o backup: '+r.slice(5).trim(),true);else toast('Backup salvo em '+r+'. Guardem este arquivo com carinho.');return;}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nosso-sim-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Backup gerado. Guardem este arquivo com carinho.');}
  document.addEventListener('click',e=>{const bt=e.target.closest('[data-action]');if(!bt){if(e.target.id==='app-overlay')document.getElementById('modal-root').innerHTML='';return;}const action=bt.dataset.action,entryId=bt.dataset.id;
    if(action==='open-album'){section='album';render();scrollTo({top:0,behavior:'instant'});return;}
    if(action==='nav'){const ex=extraSections[bt.dataset.section];if(ex&&ex.open){document.getElementById('modal-root').innerHTML='';ex.open();return;}section=bt.dataset.section;filter='todos';document.getElementById('modal-root').innerHTML='';render();scrollTo({top:0,behavior:'instant'});return;}
    if(action==='close'){document.getElementById('modal-root').innerHTML='';return;}
    if(action==='more'){openMoreMenu();return;}
    if(action.startsWith('add-')){openForm(action.slice(4));return;}
    if(action.startsWith('edit-')){const t=action.slice(5);openForm(t,getByType(t).find(x=>x.id===entryId));return;}
    if(action==='surprise'){showSurprise();return;}
    if(action==='reset-sweets'){if(confirm('Zerar todas as quantidades da simulação de doces?')){data.sweetsQty={};save();render();}return;}
    if(action==='seed-budget'){seedBudget();return;}
    if(action==='transfer-vendor'){transferVendor(entryId);return;}
    if(action==='delete'){if(!confirm('Remover este item do planejamento?'))return;const list=data[bt.dataset.type];if(!Array.isArray(list))return;data[bt.dataset.type]=list.filter(x=>x.id!==entryId);save();render();toast('Item removido.');return;}
    if(action==='filter'){filter=bt.dataset.filter;render();return;}
    if(action==='vote'){const x=data.ideas.find(v=>v.id===entryId);if(!x)return;if(!x.votes)x.votes={a:null,b:null};x.votes[bt.dataset.person]=x.votes[bt.dataset.person]===bt.dataset.vote?null:bt.dataset.vote;save();render();return;}
    if(action==='agent'){agent=bt.dataset.agent;render();document.getElementById('agent-result')?.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
    if(action==='export'){exportData();return;}
    if(action==='import'){document.getElementById('import-json').click();return;}
    if(action==='reset'){if(!confirm('Apagar TODOS os dados locais e reiniciar? Faça um backup antes!'))return;data=initial();save();section='inicio';render();window.dispatchEvent(new Event('nossosim:data-replaced'));toast('Planejamento reiniciado.');return;}
  });
  document.addEventListener('submit',e=>{if(e.target.id==='edit-form'){e.preventDefault();handleForm(e.target);}if(e.target.id==='settings-form'){e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());v.budget=int(v.budget);v.guestGoal=int(v.guestGoal);v.reservePct=Math.min(50,int(v.reservePct));data.settings={...data.settings,...v};save();render();toast('O espaço de vocês foi personalizado!');}});
  document.addEventListener('change',e=>{const el=e.target;if(el.dataset.change==='task'){const t=data.tasks.find(x=>x.id===el.dataset.id);if(t){t.done=el.checked;save();render();}}if(el.dataset.change==='sweet-qty'){const qty=Math.max(0,Number(el.value)||0);data.sweetsQty[el.dataset.id]=qty;save();render();}if(el.dataset.change==='sweets-filter'){sweetsFilter=el.value;render();}if(el.dataset.change==='guest-status'){const g=data.guests.find(x=>x.id===el.dataset.id);if(g){g.attendance=el.value;save();render();}}});
  document.addEventListener('input',e=>{if(e.target.id==='guest-search'){guestQuery=e.target.value;const ss=e.target.selectionStart;render();const newInput=document.getElementById('guest-search');newInput?.focus();try{newInput?.setSelectionRange(ss,ss);}catch(_){}}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-root').innerHTML)document.getElementById('modal-root').innerHTML='';});
  document.getElementById('import-json').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5_000_000)throw Error('Arquivo grande demais (limite 5 MB).');const obj=normalize(JSON.parse(await f.text()));if(!confirm('Importar este backup e substituir os dados locais atuais?'))return;data=obj;save();section='inicio';render();window.dispatchEvent(new Event('nossosim:data-replaced'));toast('Backup importado com sucesso.');}catch(err){toast('Falha ao importar: '+err.message,true);}finally{e.target.value='';}});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.IrisAndroid)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  // ===== Ponte para módulos externos (Íris). Superfície pequena e explícita. =====
  window.NossoSim = Object.freeze({
    version: '3.0',
    storageKey: STORAGE,
    getData: () => data,
    mutate(fn) { const r = fn(data); const ok = save(); render(); return { result: r, saved: ok }; },
    replaceData(obj) { data = normalize(obj); save(); render(); window.dispatchEvent(new Event('nossosim:data-replaced')); },
    save, render, toast,
    getSection: () => section,
    navigate(sec, opts) { section = sec; filter = 'todos'; document.getElementById('modal-root').innerHTML = ''; render(); if (!(opts && opts.noScroll)) scrollTo({ top: 0, behavior: 'instant' }); },
    setFilter(f) { filter = f; render(); },
    setGuestQuery(q) { guestQuery = String(q || ''); render(); },
    setSweetsFilter(c) { sweetsFilter = c || 'todos'; render(); },
    openForm(type, entryId) { const list = getByType(type); openForm(type, entryId && list ? list.find(x => x.id === entryId) : undefined); },
    onRender(cb) { if (typeof cb === 'function') afterRender.push(cb); },
    registerSection(key, def) {
      if (extraSections[key]) return;
      extraSections[key] = def;
      icons[key] = def.icon || '◉';
      const at = Math.min(Math.max(def.position ?? 1, 0), nav.length);
      nav.splice(at, 0, [key, def.title]);
      render();
    },
    helpers: { money, int, id, esc, sums, guestsInfo, complete, daysUntil, nameA, nameB, fmtDate, percent },
    catalogs: { sweetCatalog, categories, kinds, retailStores, agentDefs, nav: () => nav.map(x => [...x]) },
    recommendations,
    transferVendor,
  });
  render();
  window.dispatchEvent(new Event('nossosim:ready'));
})();
</script>
