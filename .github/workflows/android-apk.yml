# Constrói o APK (Capacitor) com o SITE PÚBLICO: abre vazio; os dados entram depois, pelo ZIP privado, no aparelho.
# Nenhum dado pessoal participa do build (o repositório é público e o build parte só do que está no git).
name: APK Android (Capacitor)
on:
  workflow_dispatch:
  push:
    tags: ['apk-*']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Aceitar licenças do Android SDK (o runner já traz o SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Guarda de privacidade (o git não pode conter dados pessoais)
        run: node scripts/leak-scan.mjs --tracked
      - name: Montar o site público (sem seed, sem fotos, com CSP)
        run: node scripts/build-packages.mjs capacitor/www --frontend-only
      - name: Instalar Capacitor e gerar o projeto Android
        working-directory: capacitor
        run: |
          npm ci
          npx cap add android
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=3.1.${{ github.run_number }} node scripts/patch-android.mjs
          npx cap sync android
      - name: Compilar o APK (debug, instalável por sideload)
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Varredura anti-vazamento no APK
        run: |
          cp capacitor/android/app/build/outputs/apk/debug/app-debug.apk nosso-sim-v3.1.apk
          node scripts/leak-scan.mjs nosso-sim-v3.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nosso-sim-apk
          path: nosso-sim-v3.1.apk
          retention-days: 30
